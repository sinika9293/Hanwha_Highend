name: Tests (Python 3.11)

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      # 기존 requirements.txt 의존성만 설치한다 (신규 의존성 없음).
      # 테스트는 외부 API를 호출하지 않으며 API 키·시크릿을 사용하지 않는다.
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
